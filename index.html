<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 章节拆分器</title>
    <style>
        /* 全局深色主题 */
        * {
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #ddd;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #444;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 12px;
            color: #eee;
        }
        label {
            font-weight: 500;
            margin-right: 10px;
            color: #ccc;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: center;
            margin-bottom: 16px;
        }
        .controls label.radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #ccc;
        }
        .controls input[type="radio"] {
            accent-color: #aaa;
            width: 16px;
            height: 16px;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #1a1a1a;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #888;
            outline: none;
        }
        .btn {
            background: #3a3a3a;
            border: 1px solid #555;
            color: #eee;
            padding: 8px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover {
            background: #555;
        }
        .btn-primary {
            background: #555;
            border-color: #777;
        }
        .btn-primary:hover {
            background: #777;
        }

        .results {
            margin-top: 24px;
            border-top: 1px solid #444;
            padding-top: 20px;
        }

        /* JSON 输出区 */
        .json-output {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            position: relative;
            margin-bottom: 24px;
        }
        .json-output .json-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .json-output .json-header span {
            color: #888;
            font-size: 13px;
        }
        .json-output pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #ccc;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .copy-btn {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: #444;
        }

        /* 章节列表 */
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chapter-item {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .chapter-item .chapter-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            font-size: 14px;
            margin-bottom: 8px;
            color: #aaa;
            align-items: baseline;
        }
        .chapter-item .chapter-meta .ch-id {
            color: #888;
            font-weight: 600;
        }
        .chapter-item .chapter-meta .ch-title {
            color: #eee;
            font-weight: 500;
        }
        .chapter-item .chapter-meta .ch-path {
            color: #666;
            font-family: monospace;
            font-size: 13px;
            margin-left: auto;
        }
        .chapter-item .code-wrapper {
            position: relative;
            background: #0f0f0f;
            border-radius: 6px;
            border: 1px solid #333;
            padding: 8px 10px;
            margin-top: 4px;
        }
        .chapter-item .code-wrapper pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
            color: #ccc;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 70px;
        }
        .chapter-item .copy-chapter-btn {
            position: absolute;
            top: 6px;
            right: 8px;
            background: #2a2a2a;
            border: 1px solid #555;
            color: #ccc;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .chapter-item .copy-chapter-btn:hover {
            background: #444;
        }
        .empty-message {
            color: #666;
            text-align: center;
            padding: 20px 0;
        }
        .footer-note {
            margin-top: 16px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 章节拆分器</h1>

    <div class="controls">
        <span style="color:#aaa; margin-right:4px;">拆分依据：</span>
        <label class="radio-label">
            <input type="radio" name="level" value="h1" checked /> H1 标题
        </label>
        <label class="radio-label">
            <input type="radio" name="level" value="h2" /> H2 标题
        </label>
        <button class="btn btn-primary" id="convertBtn">转换</button>
        <button class="btn" id="clearBtn">清空</button>
    </div>

    <textarea id="markdownInput" placeholder="在此粘贴整本 Markdown 内容..."></textarea>

    <div class="results" id="resultsArea" style="display:none;">
        <!-- JSON 输出 -->
        <div class="json-output">
            <div class="json-header">
                <span>📋 索引 JSON（复制到 toc.json）</span>
                <button class="copy-btn" id="copyJsonBtn">复制 JSON</button>
            </div>
            <pre id="jsonOutput"></pre>
        </div>

        <!-- 章节列表 -->
        <div class="chapter-list" id="chapterList"></div>
    </div>

    <div class="footer-note">每个章节的内容块独立复制，JSON 为纯文本数组，可直接粘贴使用。</div>
</div>

<script>
    (function() {
        const inputEl = document.getElementById('markdownInput');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultsArea = document.getElementById('resultsArea');
        const jsonOutput = document.getElementById('jsonOutput');
        const chapterList = document.getElementById('chapterList');
        const copyJsonBtn = document.getElementById('copyJsonBtn');

        // 获取选中的分割级别
        function getLevel() {
            const radio = document.querySelector('input[name="level"]:checked');
            return radio ? radio.value : 'h1';
        }

        // 清理内容（去掉前后空白）
        function cleanContent(text) {
            return text.replace(/^\s+/, '').replace(/\s+$/, '');
        }

        // 从 Markdown 中提取标题和内容，按选择级别拆分
        function splitByHeadings(markdown, level) {
            const lines = markdown.split(/\r?\n/);
            const chapters = [];
            let currentH1Number = 0;          // 全局 h1 编号（从1开始）
            let currentH2Counter = 0;         // 当前 h1 下的 h2 计数器
            let currentParentH1Number = 0;    // 当前所属 h1 的编号（用于 h2 路径）
            let currentContent = [];
            let currentTitle = '';
            let currentId = 0;                // 全局章节编号（从1开始）
            let inFrontmatter = false;

            // 检查是否在 frontmatter 区域（--- 开头）
            let frontmatterEnded = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                // 简单跳过 frontmatter（以 --- 开始和结束）
                if (!frontmatterEnded && trimmed === '---') {
                    // 如果第一行就是 ---，则进入 frontmatter
                    if (i === 0) {
                        inFrontmatter = true;
                        continue;
                    }
                    // 如果已经在 frontmatter 中，遇到 --- 结束
                    if (inFrontmatter) {
                        inFrontmatter = false;
                        frontmatterEnded = true;
                        continue;
                    }
                }
                if (inFrontmatter) continue;

                // 检测标题行
                let match = null;
                let titleLevel = 0;
                let titleText = '';

                // H1: # 开头
                if ((match = line.match(/^#\s+(.*)/))) {
                    titleLevel = 1;
                    titleText = match[1].trim();
                }
                // H2: ## 开头
                else if ((match = line.match(/^##\s+(.*)/))) {
                    titleLevel = 2;
                    titleText = match[1].trim();
                }

                // 如果检测到标题且级别匹配
                if (titleLevel > 0 && (level === 'h1' ? titleLevel === 1 : titleLevel === 2)) {
                    // 保存上一个章节（如果存在）
                    if (currentContent.length > 0) {
                        const contentStr = cleanContent(currentContent.join('\n'));
                        if (contentStr) {
                            // 生成编号和路径
                            const globalId = String(currentId).padStart(3, '0');
                            let folderNum = '';
                            let fileNum = '';

                            if (level === 'h1') {
                                // h1 章节：文件夹和文件名都使用当前 h1 编号
                                folderNum = String(currentH1Number).padStart(3, '0');
                                fileNum = folderNum;
                            } else {
                                // h2 章节：文件夹使用父 h1 编号，文件使用当前 h2 计数器
                                if (currentParentH1Number === 0) {
                                    // 如果没有父 h1，则使用 '000' 作为文件夹
                                    folderNum = '000';
                                } else {
                                    folderNum = String(currentParentH1Number).padStart(3, '0');
                                }
                                fileNum = String(currentH2Counter).padStart(3, '0');
                            }

                            chapters.push({
                                id: globalId,
                                title: currentTitle,
                                path: folderNum + '/' + fileNum + '.md',
                                content: contentStr
                            });
                        }
                    }

                    // 开始新章节
                    currentId++;
                    currentTitle = titleText;

                    // 更新层级计数器
                    if (titleLevel === 1) {
                        currentH1Number++;
                        currentParentH1Number = currentH1Number;
                        currentH2Counter = 0; // 重置 h2 计数器
                    } else if (titleLevel === 2) {
                        currentH2Counter++;
                        // 如果还没有父 h1，则给一个默认值（但此时会使用 000）
                    }

                    // 清空内容，从当前标题行开始
                    currentContent = [line];
                } else {
                    // 非标题行，累积到当前内容
                    if (currentContent.length > 0 || line.trim() !== '') {
                        currentContent.push(line);
                    }
                }
            }

            // 处理最后一个章节
            if (currentContent.length > 0) {
                const contentStr = cleanContent(currentContent.join('\n'));
                if (contentStr) {
                    const globalId = String(currentId).padStart(3, '0');
                    let folderNum = '';
                    let fileNum = '';

                    if (level === 'h1') {
                        folderNum = String(currentH1Number).padStart(3, '0');
                        fileNum = folderNum;
                    } else {
                        if (currentParentH1Number === 0) {
                            folderNum = '000';
                        } else {
                            folderNum = String(currentParentH1Number).padStart(3, '0');
                        }
                        fileNum = String(currentH2Counter).padStart(3, '0');
                    }

                    chapters.push({
                        id: globalId,
                        title: currentTitle,
                        path: folderNum + '/' + fileNum + '.md',
                        content: contentStr
                    });
                }
            }

            return chapters;
        }

        // 渲染结果
        function renderResults(chapters) {
            if (!chapters || chapters.length === 0) {
                resultsArea.style.display = 'none';
                return;
            }

            resultsArea.style.display = 'block';

            // 1. JSON 输出（纯数组，无 ``` 包裹）
            const jsonArray = chapters.map(ch => ({
                id: ch.id,
                title: ch.title,
                path: ch.path
            }));
            const jsonStr = JSON.stringify(jsonArray, null, 2);
            jsonOutput.textContent = jsonStr;

            // 2. 章节列表
            chapterList.innerHTML = '';
            chapters.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'chapter-item';

                // 元信息
                const meta = document.createElement('div');
                meta.className = 'chapter-meta';
                meta.innerHTML = `
                    <span class="ch-id">#${ch.id}</span>
                    <span class="ch-title">${escapeHtml(ch.title)}</span>
                    <span class="ch-path">📁 ${ch.path}</span>
                `;

                // 代码块
                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';

                const pre = document.createElement('pre');
                pre.textContent = ch.content;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-chapter-btn';
                copyBtn.textContent = '复制内容';
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(ch.content).then(() => {
                        copyBtn.textContent = '✅ 已复制';
                        setTimeout(() => { copyBtn.textContent = '复制内容'; }, 1500);
                    }).catch(() => {
                        // fallback
                        const ta = document.createElement('textarea');
                        ta.value = ch.content;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        copyBtn.textContent = '✅ 已复制';
                        setTimeout(() => { copyBtn.textContent = '复制内容'; }, 1500);
                    });
                });

                wrapper.appendChild(pre);
                wrapper.appendChild(copyBtn);

                item.appendChild(meta);
                item.appendChild(wrapper);
                chapterList.appendChild(item);
            });

            // 滚动到结果区域
            resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 简单转义 HTML（用于标题显示）
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 主转换函数
        function convert() {
            const markdown = inputEl.value;
            if (!markdown.trim()) {
                alert('请先粘贴 Markdown 内容！');
                return;
            }

            const level = getLevel();
            const chapters = splitByHeadings(markdown, level);

            if (chapters.length === 0) {
                alert('未找到任何章节，请检查内容是否包含 ' + level.toUpperCase() + ' 标题。');
                return;
            }

            renderResults(chapters);
        }

        // 清空
        function clearAll() {
            inputEl.value = '';
            resultsArea.style.display = 'none';
            jsonOutput.textContent = '';
            chapterList.innerHTML = '';
        }

        // 复制 JSON
        copyJsonBtn.addEventListener('click', () => {
            const text = jsonOutput.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                copyJsonBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyJsonBtn.textContent = '复制 JSON'; }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyJsonBtn.textContent = '✅ 已复制';
                setTimeout(() => { copyJsonBtn.textContent = '复制 JSON'; }, 1500);
            });
        });

        // 事件绑定
        convertBtn.addEventListener('click', convert);
        clearBtn.addEventListener('click', clearAll);

        // Ctrl+Enter 快捷转换
        inputEl.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                convert();
            }
        });

        // 如果用户粘贴了内容自动转换？不自动，需要手动点击

        console.log('📖 章节拆分器已加载。');
    })();
</script>
</body>
</html>
