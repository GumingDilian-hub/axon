<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown 章节拆分 → GitHub 自动提交</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #1e1e1e; color: #ddd;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    padding: 20px; margin: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .container {
    max-width: 1200px; width: 100%;
    background: #2d2d2d; border-radius: 12px; padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  h1 { margin-top: 0; font-weight: 300; border-bottom: 1px solid #444; padding-bottom: 12px; font-size: 1.4rem; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 24px; margin: 16px 0; align-items: center; }
  .row label { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
  .row input, .row select {
    background: #1e1e1e; color: #ddd; border: 1px solid #555;
    border-radius: 4px; padding: 6px 10px; font-size: 0.95rem; width: 80px;
  }
  .row select { width: auto; padding: 6px 16px 6px 10px; }
  textarea {
    width: 100%; min-height: 300px; background: #1e1e1e; color: #ddd;
    border: 1px solid #555; border-radius: 4px; padding: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.9rem; resize: vertical; tab-size: 4;
  }
  .btn {
    background: #3a3a3a; color: #fff; border: none; border-radius: 4px;
    padding: 10px 28px; font-size: 1rem; cursor: pointer; transition: background .2s;
  }
  .btn:hover { background: #555; }
  .btn-primary { background: #2d7d46; }
  .btn-primary:hover { background: #3a9e5a; }
  .btn:disabled { background: #444 !important; color: #888; cursor: not-allowed; }
  .output-section { margin-top: 24px; border-top: 1px solid #444; padding-top: 20px; }
  .output-section h2 { font-weight: 300; font-size: 1.15rem; margin: 0 0 12px 0; }
  .json-output {
    background: #1e1e1e; border: 1px solid #555; border-radius: 4px; padding: 12px;
    white-space: pre-wrap; word-break: break-all;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: .85rem; max-height: 300px; overflow: auto;
  }
  .copy-btn {
    background: #3a3a3a; color: #ddd; border: none; border-radius: 4px;
    padding: 4px 14px; cursor: pointer; font-size: .8rem; transition: background .2s;
  }
  .copy-btn:hover { background: #555; }
  .chapters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  @media (max-width: 768px) { .chapters-grid { grid-template-columns: 1fr; } }
  .chapter-card { background: #1e1e1e; border: 1px solid #444; border-radius: 4px; padding: 8px; }
  .chapter-card .filename {
    background: #2d2d2d; padding: 4px 10px; font-size: .8rem; color: #aaa;
    border-bottom: 1px solid #444; margin: -8px -8px 8px -8px;
    border-radius: 4px 4px 0 0; display: flex; justify-content: space-between;
    align-items: center; gap: 8px;
  }
  .chapter-card .filename .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .chapter-card .filename .actions button {
    background: transparent; border: none; color: #aaa;
    cursor: pointer; font-size: .75rem; padding: 0 4px;
  }
  .chapter-card .filename .actions button:hover { color: #fff; }
  .chapter-card .filename .actions .del-btn:hover { color: #e74c3c; }
  .chapter-card pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: .8rem; max-height: 400px; overflow: auto; padding: 4px;
  }
  .status { margin-top: 12px; color: #aaa; font-size: .9rem; }
  .inline-hint { color: #888; font-size: .8rem; margin-left: 6px; }
  .json-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .empty-hint { color: #888; padding: 20px; text-align: center; }
  .result-area {
    margin-top: 16px; padding: 12px; background: #1e1e1e;
    border: 1px solid #444; border-radius: 4px; font-size: .85rem;
    max-height: 260px; overflow: auto;
  }
  .result-area a { color: #6cb6ff; word-break: break-all; text-decoration: none; }
  .result-area a:hover { text-decoration: underline; }
  .worker-bar {
    background: #232323; border: 1px solid #444; border-radius: 6px;
    padding: 12px; margin-bottom: 8px;
  }
  .worker-bar .row { margin: 6px 0; }
  .worker-bar input[type="text"],
  .worker-bar input[type="password"] {
    width: auto; flex: 1; min-width: 200px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📖 Markdown → 章节拆分 → GitHub 自动提交</h1>

  <!-- Worker 配置 -->
  <div class="worker-bar">
    <div class="row">
      <label style="flex:1; min-width:260px;">Worker 地址：
        <input type="text" id="workerUrl" placeholder="https://xxx.workers.dev" />
      </label>
      <label style="flex:0 0 auto;">访问密钥：
        <input type="password" id="accessKey" placeholder="可留空" style="min-width:140px;" />
      </label>
    </div>
    <div class="row">
      <label>仓库：<input type="text" id="repoInput" value="axon" style="width:130px" /></label>
      <label>分支：<input type="text" id="branchInput" value="main" style="width:90px" /></label>
      <label style="flex:1; min-width:240px;">提交信息：
        <input type="text" id="commitMsg" placeholder="留空自动生成"
               style="flex:1; width:auto; min-width:180px;" />
      </label>
    </div>
  </div>

  <!-- 拆分配置 -->
  <div class="row">
    <label>分割依据：
      <select id="splitLevel">
        <option value="1">H1 (一级标题)</option>
        <option value="2" selected>H2 (二级标题)</option>
      </select>
    </label>
    <label>起始文件夹：
      <input type="text" id="folderStart" value="001" maxlength="3" />
      <span class="inline-hint">三位数字</span>
    </label>
    <label>起始文件编号：
      <input type="text" id="fileStart" value="001" maxlength="3" />
      <span class="inline-hint">三位数字</span>
    </label>
    <button class="btn" id="generateBtn">生成</button>
  </div>

  <textarea id="inputMd" placeholder="在此粘贴整本 Markdown 内容……"></textarea>
  <div class="inline-hint" style="margin-top:6px;">提示：Ctrl / ⌘ + Enter 快速生成</div>

  <div id="outputArea" class="output-section" style="display:none;">
    <div class="json-header">
      <h2 style="margin:0;">📄 toc.json 条目参考（仅供复制，不会提交）</h2>
      <button class="copy-btn" id="copyJsonBtn">复制全部条目</button>
    </div>
    <div class="json-output" id="jsonOutput"></div>

    <h2 style="margin-top:24px;">📁 各章节文件（可删除，编号自动补齐）</h2>
    <div id="chaptersContainer" class="chapters-grid"></div>

    <div class="row" style="margin-top:20px;">
      <button class="btn btn-primary" id="submitBtn">🚀 提交到 GitHub</button>
      <span class="inline-hint">仅提交上述 .md 文件，不含 toc.json</span>
    </div>
    <div class="status" id="statusMsg"></div>
    <div class="result-area" id="resultArea" style="display:none;"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var inputMd = $('inputMd');
  var splitLevel = $('splitLevel');
  var folderStart = $('folderStart');
  var fileStart = $('fileStart');
  var generateBtn = $('generateBtn');
  var outputArea = $('outputArea');
  var jsonOutput = $('jsonOutput');
  var chaptersContainer = $('chaptersContainer');
  var statusMsg = $('statusMsg');
  var copyJsonBtn = $('copyJsonBtn');
  var submitBtn = $('submitBtn');
  var resultArea = $('resultArea');
  var commitMsgInput = $('commitMsg');
  var repoInput = $('repoInput');
  var branchInput = $('branchInput');
  var workerUrlInput = $('workerUrl');
  var accessKeyInput = $('accessKey');

  // 从本地缓存恢复配置
  try {
    workerUrlInput.value = localStorage.getItem('md_worker_url') || workerUrlInput.value;
    repoInput.value = localStorage.getItem('md_repo') || repoInput.value;
    branchInput.value = localStorage.getItem('md_branch') || branchInput.value;
    accessKeyInput.value = localStorage.getItem('md_access_key') || '';
  } catch (e) {}

  function persist() {
    try {
      localStorage.setItem('md_worker_url', workerUrlInput.value.trim());
      localStorage.setItem('md_repo', repoInput.value.trim());
      localStorage.setItem('md_branch', branchInput.value.trim());
      localStorage.setItem('md_access_key', accessKeyInput.value);
    } catch (e) {}
  }

  var state = { chapters: [], folder: '001', startNum: 1 };

  function pad3(n) {
    var s = String(n);
    while (s.length < 3) s = '0' + s;
    return s;
  }

  function parseHeadings(md) {
    var lines = md.split('\n');
    var headings = [];
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].trim().match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        headings.push({ level: m[1].length, title: m[2].trim(), lineIndex: i });
      }
    }
    return { headings: headings, lines: lines };
  }

  function generateRawChapters(md, split) {
    var p = parseHeadings(md);
    var headings = p.headings, lines = p.lines;

    var idxs = [];
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].level === split) idxs.push(i);
    }
    if (!idxs.length) return [];

    var out = [];
    for (var s = 0; s < idxs.length; s++) {
      var h = headings[idxs[s]];
      var startLine = h.lineIndex;
      var endLine = lines.length;
      if (s + 1 < idxs.length) endLine = headings[idxs[s + 1]].lineIndex;

      var content = lines.slice(startLine, endLine).join('\n').replace(/\s+$/, '');

      var subTitles = [];
      for (var j = 0; j < headings.length; j++) {
        var hj = headings[j];
        if (hj.lineIndex >= startLine && hj.lineIndex < endLine && hj.level === split + 1) {
          subTitles.push(hj.title);
        }
      }

      var title = h.title;
      if (subTitles.length) title += '，' + subTitles.join('，');

      out.push({ title: title, content: content });
    }
    return out;
  }

  function chapterPath(index) {
    return state.folder + '/' + pad3(state.startNum + index) + '.md';
  }

  function buildToc() {
    return state.chapters.map(function (ch, i) {
      return { id: pad3(state.startNum + i), title: ch.title, path: chapterPath(i) };
    });
  }

  function copyText(text, btn) {
    function done() {
      if (!btn) return;
      var orig = btn.getAttribute('data-orig');
      if (orig === null) {
        orig = btn.textContent;
        btn.setAttribute('data-orig', orig);
      }
      btn.textContent = '✅ 已复制';
      setTimeout(function () { btn.textContent = orig; }, 1500);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); done(); });
    } else {
      fallback(); done();
    }
  }

  function renderOutput() {
    resultArea.style.display = 'none';
    resultArea.innerHTML = '';

    if (!state.chapters.length) {
      jsonOutput.textContent = '（无章节）';
      chaptersContainer.innerHTML = '<div class="empty-hint">暂无章节，请重新生成。</div>';
      statusMsg.textContent = '⚠️ 无章节数据';
      submitBtn.disabled = true;
      return;
    }

    submitBtn.disabled = false;

    // toc 参考（不提交）
    var toc = buildToc();
    jsonOutput.textContent = toc.map(function (t) {
      var tj = JSON.stringify(t.title);
      tj = tj.substring(1, tj.length - 1);
      return '  { "id": "' + t.id + '", "title": "' + tj + '", "path": "' + t.path + '" }';
    }).join(',\n');

    chaptersContainer.innerHTML = '';

    state.chapters.forEach(function (ch, i) {
      var card = document.createElement('div');
      card.className = 'chapter-card';

      var fn = document.createElement('div');
      fn.className = 'filename';

      var nameSpan = document.createElement('span');
      nameSpan.textContent = chapterPath(i);

      var actions = document.createElement('div');
      actions.className = 'actions';

      var copyBtn = document.createElement('button');
      copyBtn.textContent = '📋 复制内容';
      copyBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        copyText(ch.content, copyBtn);
      });

      var delBtn = document.createElement('button');
      delBtn.textContent = '🗑️ 删除';
      delBtn.className = 'del-btn';
      delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('确定要删除章节 "' + ch.title + '" 吗？\n后续编号将自动补齐。')) return;
        state.chapters.splice(i, 1);
        renderOutput();
        statusMsg.textContent = '已删除，剩余 ' + state.chapters.length + ' 个章节。';
      });

      actions.appendChild(copyBtn);
      actions.appendChild(delBtn);
      fn.appendChild(nameSpan);
      fn.appendChild(actions);
      card.appendChild(fn);

      var pre = document.createElement('pre');
      pre.textContent = ch.content;
      card.appendChild(pre);

      chaptersContainer.appendChild(card);
    });

    statusMsg.textContent = '✅ 当前 ' + state.chapters.length + ' 个章节，文件夹 '
      + state.folder + '，编号从 ' + pad3(state.startNum) + ' 开始连续递增。';
  }

  function generate() {
    var md = inputMd.value;
    if (!md.trim()) { alert('请先粘贴 Markdown 内容！'); return; }

    var split = parseInt(splitLevel.value, 10);

    var folderRaw = folderStart.value.trim();
    if (!/^\d{1,3}$/.test(folderRaw)) { alert('起始文件夹必须为数字，如 001'); return; }
    var folder = pad3(parseInt(folderRaw, 10));

    var startNum = parseInt(fileStart.value.trim(), 10);
    if (isNaN(startNum) || startNum < 1 || startNum > 999) {
      alert('起始文件编号必须为 1~999 的数字'); return;
    }

    var chapters = generateRawChapters(md, split);
    if (!chapters.length) {
      alert('未找到任何 H' + split + ' 标题，请检查 Markdown 或更换分割级别。');
      return;
    }

    state.chapters = chapters;
    state.folder = folder;
    state.startNum = startNum;

    outputArea.style.display = 'block';
    renderOutput();
  }

  async function submitToGitHub() {
    if (!state.chapters.length) { alert('没有可提交的章节'); return; }

    var workerUrl = workerUrlInput.value.trim().replace(/\/+$/, '');
    if (!workerUrl) {
      alert('请先填写 Worker 地址，例如 https://xxx.workers.dev');
      workerUrlInput.focus();
      return;
    }

    var repo = repoInput.value.trim();
    var branch = branchInput.value.trim() || 'main';
    if (!repo) { alert('请填写仓库名'); return; }

    persist();

    // 只提交 md 文件，不含 toc.json
    var files = state.chapters.map(function (ch, i) {
      return { path: chapterPath(i), content: ch.content };
    });

    var msg = commitMsgInput.value.trim() ||
      ('更新 ' + state.folder + ' 章节（' + state.chapters.length + ' 篇）');

    var headers = { 'Content-Type': 'application/json' };
    var key = accessKeyInput.value.trim();
    if (key) headers['X-Access-Key'] = key;

    submitBtn.disabled = true;
    var origText = submitBtn.textContent;
    submitBtn.textContent = '⏳ 提交中…';
    statusMsg.textContent = '正在提交到 GitHub…';
    resultArea.style.display = 'none';

    try {
      var res = await fetch(workerUrl + '/api/commit', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          files: files,
          commitMessage: msg,
          repo: repo,
          branch: branch
        })
      });

      var text = await res.text();
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) {}

      if (!res.ok || !data || !data.ok) {
        var em = (data && data.error) ? data.error : ('HTTP ' + res.status + ' ' + text);
        throw new Error(em);
      }

      statusMsg.textContent = '✅ 提交成功！共 ' + data.files.length + ' 个文件。';

      var html = '<div>提交：<a href="' + data.commit.url + '" target="_blank" rel="noopener">'
        + data.commit.sha.substring(0, 10) + '</a></div>';
      html += '<div style="margin-top:8px;">仓库：' + data.owner + '/' + data.repo
        + ' @ ' + data.branch + '</div>';
      html += '<ul style="margin:8px 0 0 0; padding-left:18px;">';
      data.files.forEach(function (f) {
        html += '<li><a href="' + f.url + '" target="_blank" rel="noopener">' + f.path + '</a></li>';
      });
      html += '</ul>';

      resultArea.innerHTML = html;
      resultArea.style.display = 'block';
    } catch (err) {
      statusMsg.textContent = '❌ 提交失败：' + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = origText;
    }
  }

  generateBtn.addEventListener('click', generate);
  submitBtn.addEventListener('click', submitToGitHub);
  copyJsonBtn.addEventListener('click', function () {
    var text = jsonOutput.textContent;
    if (!text || text === '（无章节）') return;
    copyText(text, copyJsonBtn);
  });

  inputMd.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      generate();
    }
  });

  console.log('Markdown 转换器（Worker 版）已加载。');
})();
</script>
</body>
</html>
