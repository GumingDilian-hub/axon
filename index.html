<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 章节转换器（带删除）</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #ddd;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 {
            margin-top: 0;
            font-weight: 300;
            border-bottom: 1px solid #444;
            padding-bottom: 12px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin: 16px 0;
            align-items: center;
        }
        .row label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .row input, .row select {
            background: #1e1e1e;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.95rem;
            width: 80px;
        }
        .row select {
            width: auto;
            padding: 6px 16px 6px 10px;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            background: #1e1e1e;
            color: #ddd;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            tab-size: 4;
        }
        .btn {
            background: #3a3a3a;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 28px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #555;
        }
        .output-section {
            margin-top: 24px;
            border-top: 1px solid #444;
            padding-top: 20px;
        }
        .output-section h2 {
            font-weight: 300;
            font-size: 1.2rem;
            margin: 0 0 12px 0;
        }
        .json-output {
            background: #1e1e1e;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 12px;
            position: relative;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow: auto;
        }
        .copy-btn {
            background: #3a3a3a;
            color: #ddd;
            border: none;
            border-radius: 4px;
            padding: 4px 14px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
            margin-left: 12px;
        }
        .copy-btn:hover {
            background: #555;
        }
        .chapters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 12px;
        }
        @media (max-width: 768px) {
            .chapters-grid {
                grid-template-columns: 1fr;
            }
        }
        .chapter-card {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            position: relative;
        }
        .chapter-card .filename {
            background: #2d2d2d;
            padding: 4px 10px;
            font-size: 0.8rem;
            color: #aaa;
            border-bottom: 1px solid #444;
            margin: -8px -8px 8px -8px;
            border-radius: 4px 4px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chapter-card .filename .actions {
            display: flex;
            gap: 8px;
        }
        .chapter-card .filename .actions button {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0 4px;
        }
        .chapter-card .filename .actions button:hover {
            color: #fff;
        }
        .chapter-card .filename .actions .del-btn:hover {
            color: #e74c3c;
        }
        .chapter-card pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.8rem;
            max-height: 400px;
            overflow: auto;
            background: #1e1e1e;
            padding: 4px;
        }
        .status {
            margin-top: 12px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .inline-hint {
            color: #888;
            font-size: 0.8rem;
            margin-left: 6px;
        }
        .json-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .empty-hint {
            color: #888;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 Markdown → 章节拆分 + toc.json 条目（带删除）</h1>
    <div class="row">
        <label>分割依据：
            <select id="splitLevel">
                <option value="1">H1 (一级标题)</option>
                <option value="2" selected>H2 (二级标题)</option>
            </select>
        </label>
        <label>起始文件夹：
            <input type="text" id="folderStart" value="001" maxlength="3" style="width:60px;" />
            <span class="inline-hint">三位数字</span>
        </label>
        <label>起始文件编号：
            <input type="text" id="fileStart" value="001" maxlength="3" style="width:60px;" />
            <span class="inline-hint">三位数字</span>
        </label>
        <button class="btn" id="generateBtn">生成</button>
    </div>
    <textarea id="inputMd" placeholder="在此粘贴整本 Markdown 内容……"></textarea>

    <div id="outputArea" class="output-section" style="display:none;">
        <div class="json-header">
            <h2 style="margin:0;">📄 toc.json 条目列表（不含外层 [ ]）</h2>
            <button class="copy-btn" id="copyJsonBtn">复制全部条目</button>
        </div>
        <div class="json-output" id="jsonOutput"></div>

        <h2 style="margin-top:24px;">📁 各章节文件（点击删除可移除，编号自动补齐）</h2>
        <div id="chaptersContainer" class="chapters-grid"></div>
        <div class="status" id="statusMsg"></div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        const inputMd = document.getElementById('inputMd');
        const splitLevel = document.getElementById('splitLevel');
        const folderStart = document.getElementById('folderStart');
        const fileStart = document.getElementById('fileStart');
        const generateBtn = document.getElementById('generateBtn');
        const outputArea = document.getElementById('outputArea');
        const jsonOutput = document.getElementById('jsonOutput');
        const chaptersContainer = document.getElementById('chaptersContainer');
        const statusMsg = document.getElementById('statusMsg');
        const copyJsonBtn = document.getElementById('copyJsonBtn');

        // 全局存储当前章节数据
        let currentChapters = [];
        let currentFolder = '001';
        let currentStartNum = 1;

        function pad3(num) {
            return String(num).padStart(3, '0');
        }

        function parseHeadings(md) {
            const lines = md.split('\n');
            const headings = [];
            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                const match = trimmed.match(/^(#{1,6})\s+(.*)/);
                if (match) {
                    const level = match[1].length;
                    const title = match[2].trim();
                    headings.push({ level, title, lineIndex: idx, raw: line });
                }
            });
            return { headings, lines };
        }

        function extractChapterContent(lines, startIdx, endIdx) {
            return lines.slice(startIdx, endIdx).join('\n');
        }

        // 生成原始章节数据（不依赖编号）
        function generateRawChapters(md, split) {
            const { headings, lines } = parseHeadings(md);
            const splitIndices = [];
            headings.forEach((h, idx) => {
                if (h.level === split) splitIndices.push(idx);
            });
            if (splitIndices.length === 0) return [];

            const rawChapters = [];
            for (let i = 0; i < splitIndices.length; i++) {
                const hIdx = splitIndices[i];
                const h = headings[hIdx];
                const startLine = h.lineIndex;
                let endLine = lines.length;
                if (i + 1 < splitIndices.length) {
                    endLine = headings[splitIndices[i + 1]].lineIndex;
                }
                const content = extractChapterContent(lines, startLine, endLine);

                const subLevel = split + 1;
                const subTitles = [];
                for (let j = 0; j < headings.length; j++) {
                    const hj = headings[j];
                    if (hj.lineIndex >= startLine && hj.lineIndex < endLine && hj.level === subLevel) {
                        subTitles.push(hj.title);
                    }
                }
                let title = h.title;
                if (subTitles.length > 0) {
                    title += '，' + subTitles.join('，');
                }

                rawChapters.push({
                    title: title,
                    content: content,
                    rawHeading: h.raw
                });
            }
            return rawChapters;
        }

        // 渲染输出（基于 currentChapters）
        function renderOutput() {
            if (currentChapters.length === 0) {
                jsonOutput.textContent = '（无章节）';
                chaptersContainer.innerHTML = '<div class="empty-hint">暂无章节，请重新生成。</div>';
                statusMsg.textContent = '⚠️ 无章节数据';
                return;
            }

            // 生成 JSON 条目（按当前顺序，编号从 currentStartNum 递增）
            const jsonItems = currentChapters.map((ch, idx) => {
                const id = pad3(currentStartNum + idx);
                const path = currentFolder + '/' + id + '.md';
                return `  { "id": "${id}", "title": "${ch.title}", "path": "${path}" }`;
            });
            jsonOutput.textContent = jsonItems.join(',\n');

            // 渲染卡片
            chaptersContainer.innerHTML = '';
            currentChapters.forEach((ch, idx) => {
                const id = pad3(currentStartNum + idx);
                const path = currentFolder + '/' + id + '.md';

                const card = document.createElement('div');
                card.className = 'chapter-card';

                const filenameDiv = document.createElement('div');
                filenameDiv.className = 'filename';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = path;

                const actions = document.createElement('div');
                actions.className = 'actions';

                const copyBtn = document.createElement('button');
                copyBtn.textContent = '📋 复制内容';
                copyBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const text = ch.content;
                    navigator.clipboard.writeText(text).then(() => {
                        const orig = this.textContent;
                        this.textContent = '✅ 已复制';
                        setTimeout(() => { this.textContent = orig; }, 1500);
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        const orig = this.textContent;
                        this.textContent = '✅ 已复制';
                        setTimeout(() => { this.textContent = orig; }, 1500);
                    });
                });

                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑️ 删除';
                delBtn.className = 'del-btn';
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (confirm(`确定要删除章节 "${ch.title}" 吗？\n后续编号将自动补齐。`)) {
                        currentChapters.splice(idx, 1);
                        renderOutput();
                        statusMsg.textContent = `已删除，剩余 ${currentChapters.length} 个章节。`;
                    }
                });

                actions.appendChild(copyBtn);
                actions.appendChild(delBtn);
                filenameDiv.appendChild(nameSpan);
                filenameDiv.appendChild(actions);
                card.appendChild(filenameDiv);

                const pre = document.createElement('pre');
                pre.textContent = ch.content;
                card.appendChild(pre);

                chaptersContainer.appendChild(card);
            });

            statusMsg.textContent = `✅ 当前 ${currentChapters.length} 个章节，文件夹：${currentFolder}，编号从 ${pad3(currentStartNum)} 开始连续递增。`;
        }

        // 生成主函数
        function generate() {
            const md = inputMd.value;
            if (!md.trim()) {
                alert('请先粘贴 Markdown 内容！');
                return;
            }

            const split = parseInt(splitLevel.value, 10);
            const folder = folderStart.value.trim().padStart(3, '0');
            if (!/^\d{3}$/.test(folder)) {
                alert('起始文件夹必须为三位数字，如 001');
                return;
            }
            let startNum = parseInt(fileStart.value.trim(), 10);
            if (isNaN(startNum) || startNum < 1 || startNum > 999) {
                alert('起始文件编号必须为 1~999 的数字');
                return;
            }

            const raw = generateRawChapters(md, split);
            if (raw.length === 0) {
                alert(`未找到任何 H${split} 标题，请检查 Markdown 或更换分割级别。`);
                return;
            }

            // 保存全局状态
            currentChapters = raw;
            currentFolder = folder;
            currentStartNum = startNum;

            outputArea.style.display = 'block';
            renderOutput();
        }

        // 复制 JSON 条目（纯对象）
        copyJsonBtn.addEventListener('click', function() {
            const text = jsonOutput.textContent;
            if (!text || text === '（无章节）') return;
            navigator.clipboard.writeText(text).then(() => {
                const orig = this.textContent;
                this.textContent = '✅ 已复制';
                setTimeout(() => { this.textContent = orig; }, 1500);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const orig = this.textContent;
                this.textContent = '✅ 已复制';
                setTimeout(() => { this.textContent = orig; }, 1500);
            });
        });

        generateBtn.addEventListener('click', generate);

        inputMd.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                generate();
            }
        });

        console.log('Markdown 转换器（带删除）已加载。');
    })();
</script>
</body>
</html>
